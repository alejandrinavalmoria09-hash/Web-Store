<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("Motos.jpeg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      padding: 35px;
      border-radius: 25px;
      width: 380px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(0,0,0,0.25);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: white;
      font-weight: bold;
      font-size: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      background: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #cc0000;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.3s;
      font-weight: bold;
    }

    button:hover {
      background: #ff0000;
    }

    p {
      text-align: center;
      margin-top: 18px;
      color: #fff;
      font-size: 15px;
    }

    a {
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>

</head>
<body>

<div class="container">
  <h2>Login</h2>

  <!-- Changed email input to username -->
  <input type="text" id="logUsername" placeholder="Username">
  <input type="password" id="logPass" placeholder="Password">

  <button onclick="loginAccount()">Login</button>

  <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
  function loginAccount() {
    let username = document.getElementById("logUsername").value;
    let password = document.getElementById("logPass").value;

    let savedUser = JSON.parse(localStorage.getItem("account"));

    if (!savedUser) {
      alert("No account found. Please register first.");
      return;
    }

    // ✅ Check username instead of email
    if (username === savedUser.username && password === savedUser.password) {
      alert("Login Successful!");
      window.location.href = "home.html";
    } else {
      alert("Wrong username or password.");
    }
  }
</script>

</body>
</html>
